<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assembleia — Votação de Pautas</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="shell">

  <!-- navegação -->
  <aside class="rail">
    <div class="rail-brand">
      <svg class="rail-brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 15L13 22L26 8" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2" opacity="0.35"/>
      </svg>
      <div class="rail-brand-text">
        <span class="rail-brand-title">Assembleia</span>
        <span class="rail-brand-sub">votação de pautas</span>
      </div>
    </div>

    <nav class="rail-nav" aria-label="Navegação principal">
      <button class="rail-link" data-nav="topics" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 5.5h12M4 10h12M4 14.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Pautas
      </button>
      <button class="rail-link" data-nav="newTopic" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Nova pauta
      </button>
    </nav>

    <div class="rail-foot">
      <button class="rail-link rail-link--muted" id="btn-toggle-log" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Atividade
        <span class="rail-log-dot" id="log-dot" hidden></span>
      </button>
      <div class="rail-endpoint">
        <label for="api-base">API</label>
        <input id="api-base" type="text" spellcheck="false" autocomplete="off">
      </div>
    </div>
  </aside>

  <!-- Topo mobile -->
  <header class="topbar">
    <button class="topbar-back" id="btn-back" type="button" aria-label="Voltar" hidden>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="topbar-title" id="topbar-title">Pautas</span>
    <button class="topbar-menu" id="btn-menu" type="button" aria-label="Menu">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- Cabeçalho de contexto (desktop) + botão voltar -->
  <div class="context-bar">
    <button class="context-back" id="btn-back-desktop" type="button" hidden>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar
    </button>
    <h1 class="context-title" id="context-title">Pautas</h1>
  </div>

  <!-- Conteúdo principal -->
  <main class="main" id="app" aria-live="polite"></main>

  <!-- Painel de atividade / log de chamadas -->
  <aside class="log-panel" id="log-panel" aria-label="Registro de chamadas à API">
    <div class="log-panel-head">
      <span>Atividade</span>
      <button id="btn-close-log" type="button" aria-label="Fechar">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="log-panel-body" id="log-body">
      <p class="log-empty">Nenhuma chamada ainda.</p>
    </div>
  </aside>
  <div class="log-scrim" id="log-scrim" hidden></div>

  <!-- Toast de status -->
  <div class="toast" id="toast" role="status" hidden></div>

</div>

<script src="js/app.js"></script>
</body>
</html>
